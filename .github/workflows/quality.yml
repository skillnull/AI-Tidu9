name: Quality

on:
  pull_request:
    branches:
      - main
      - "support/*.x"
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: npm install --no-package-lock
      - if: github.ref_type == 'branch' || github.event_name == 'pull_request'
        run: npm run policy -- branch
        env:
          TIDU_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      - if: github.ref_type == 'branch' || github.event_name == 'pull_request'
        run: npm run policy -- commit
        env:
          TIDU_COMMIT_MESSAGE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
      - if: github.event_name == 'pull_request'
        run: npm run policy -- pull-request
        env:
          TIDU_HEAD_BRANCH: ${{ github.head_ref }}
          TIDU_BASE_BRANCH: ${{ github.base_ref }}
          TIDU_PR_TITLE: ${{ github.event.pull_request.title }}
      - if: github.event_name == 'push' && github.ref_type == 'branch'
        run: npm run policy -- owner
        env:
          TIDU_ACTOR: ${{ github.actor }}
          TIDU_BRANCH_NAME: ${{ github.ref_name }}
      - run: npm run policy -- versions
      - if: github.ref_type == 'branch'
        run: git fetch --no-tags origin '+refs/heads/support/*:refs/remotes/origin/support/*'
      - if: github.ref_type == 'branch'
        run: npm run policy -- release-lines
        env:
          TIDU_RELEASE_LINE: ${{ github.base_ref || github.ref_name }}
      - if: github.ref_type == 'tag'
        run: npm run policy -- tag
        env:
          TIDU_TAG_NAME: ${{ github.ref_name }}

  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.14.0, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --no-package-lock
      - run: npm run check

  verify-required:
    name: Verify
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - if: needs.verify.result != 'success'
        run: exit 1
      - run: echo "All verification jobs passed."
