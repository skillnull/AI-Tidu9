<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="170" viewBox="0 0 1080 170" role="img" aria-labelledby="title description">
  <title id="title">From goal to verifiable outcome</title>
  <desc id="description">A user goal passes through entry points, policy gates, the Agent kernel, the capability pool, and independent verification before becoming a verifiable outcome; rejected results return to the Agent kernel.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
    <style>
      .node { fill: #f6f8fa; stroke: #0969da; stroke-width: 1.5; }
      .label { fill: #24292f; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .edge { fill: none; stroke: #57606a; stroke-width: 1.8; marker-end: url(#arrow); }
      .feedback { stroke-dasharray: 5 4; }
      .feedback-background { fill: #ffffff; }
      .feedback-label { fill: #57606a; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .arrowhead { fill: #57606a; }
      @media (prefers-color-scheme: dark) {
        .node { fill: #21262d; stroke: #58a6ff; }
        .label { fill: #f0f6fc; }
        .edge { stroke: #8c959f; }
        .feedback-background { fill: #0d1117; }
        .feedback-label { fill: #b1bac4; }
        .arrowhead { fill: #8c959f; }
      }
    </style>
  </defs>

  <g aria-hidden="true">
    <path class="edge" d="M 116 52 H 134" />
    <path class="edge" d="M 274 52 H 292" />
    <path class="edge" d="M 450 52 H 468" />
    <path class="edge" d="M 580 52 H 598" />
    <path class="edge" d="M 768 52 H 786" />
    <path class="edge" d="M 902 52 H 920" />
    <path class="edge feedback" d="M 844 84 V 140 H 524 V 84" />

    <rect class="node" x="8" y="20" width="108" height="64" rx="5" />
    <text class="label" x="62" y="57">🎯 User goal</text>

    <rect class="node" x="134" y="20" width="140" height="64" rx="5" />
    <text class="label" x="204" y="47">
      <tspan x="204">Codex · Cursor</tspan>
      <tspan x="204" dy="20">CLI · Browser</tspan>
    </text>

    <rect class="node" x="292" y="20" width="158" height="64" rx="5" />
    <text class="label" x="371" y="47">
      <tspan x="371">🛡️ Policy · Quota</tspan>
      <tspan x="371" dy="20">Approval · Secret Gate</tspan>
    </text>

    <rect class="node" x="468" y="20" width="112" height="64" rx="5" />
    <text class="label" x="524" y="57">Agent kernel</text>

    <rect class="node" x="598" y="20" width="170" height="64" rx="5" />
    <text class="label" x="683" y="47">
      <tspan x="683">Model · Agent · Skill</tspan>
      <tspan x="683" dy="20">MCP · Tool · Knowledge</tspan>
    </text>

    <rect class="node" x="786" y="20" width="116" height="64" rx="5" />
    <text class="label" x="844" y="47">
      <tspan x="844">✅ Independent</tspan>
      <tspan x="844" dy="20">verification</tspan>
    </text>

    <rect class="node" x="920" y="20" width="144" height="64" rx="5" />
    <text class="label" x="992" y="47">
      <tspan x="992">📦 Verifiable</tspan>
      <tspan x="992" dy="20">outcome</tspan>
    </text>

    <rect class="feedback-background" x="655" y="128" width="58" height="24" rx="4" />
    <text class="feedback-label" x="684" y="145">Rejected</text>
  </g>
</svg>
